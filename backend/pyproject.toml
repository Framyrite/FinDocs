
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # PEP 8: ошибки оформления
    "W",    # PEP 8: предупреждения
    "F",    # Pyflakes: ошибки кода и неиспользуемые импорты
    "I",    # isort: порядок импортов
    "UP",   # pyupgrade: современный синтаксис Python
    "B",    # flake8-bugbear: потенциальные ошибки
    "C4",   # flake8-comprehensions: упрощение коллекций
    "SIM",  # flake8-simplify: упрощение конструкций
]

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]
