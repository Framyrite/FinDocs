[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",       # PEP 8
    "W",       # PEP 8 warnings
    "F",       # Pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PIE",     # flake8-pie
    "PERF",    # Performance
    "RSE",     # raise statements
    "RET",     # return statements
    "RUF100",  # Unused noqa
]

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]
